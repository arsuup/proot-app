name: Build APK & IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Generate native android folder
        run: npx expo prebuild --platform android --clean

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.4.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4.1'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate native ios folder
        run: npx expo prebuild --platform ios --clean

      - name: Install pods
        run: |
          cd ios
          pod install

      - name: Build unsigned .app
        run: |
          set -eo pipefail
          cd ios
          
          # Extraction du nom du schéma depuis le projet
          XCODEPROJ=$(ls -d *.xcodeproj | head -n 1)
          SCHEME=$(basename "$XCODEPROJ" .xcodeproj)
          echo "Schéma compilé : $SCHEME"
          
          xcodebuild -workspace *.xcworkspace \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Package into .ipa
        run: |
          cd "$GITHUB_WORKSPACE"
          
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Erreur: Aucun dossier .app trouvé dans build/Build/Products/Release-iphoneos"
            exit 1
          fi
          
          echo "Dossier .app trouvé : $APP_PATH"
          
          rm -rf Payload app-release-unsigned.ipa
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -r app-release-unsigned.ipa Payload
          
          echo "=== Vérification de l'IPA créé ==="
          ls -lh app-release-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned-ipa
          path: app-release-unsigned.ipa
          if-no-files-found: error
